# Optional. Render can read this file automatically if you deploy via
# "New +" -> "Blueprint" and point it at a repo containing this file, instead
# of manually clicking through "New Web Service". Either method works —
# see README.md for the manual click-path if you'd rather not use this.
services:
  - type: web
    name: nexora-ai-proxy
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: APP_SECRET
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
